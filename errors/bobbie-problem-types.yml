format: graphql-user-errors
description: >-
  Bobbie publishes no OpenAPI, so there are no RFC 9457 problem+json responses to derive.
  The real error contract lives in two places: the typed userErrors payloads in the
  Storefront GraphQL schema served from Bobbie's host, and JSON-RPC 2.0 errors on the MCP
  endpoints. Both are enumerated below straight from the introspected SDL and an observed
  live error response. Nothing is invented.
rfc9457: false
envelopes:
  - surface: graphql
    endpoint: https://www.hibobbie.com/api/2026-04/graphql.json
    transport_status: 200
    request_errors:
      field: errors[]
      shape: [message, locations, path, extensions.code]
      note: Malformed/unauthorized/throttled requests surface here, not as HTTP 4xx.
    mutation_errors:
      interface: DisplayableError
      shape: [field, message, code]
      note: Every mutation returns a typed *UserError list alongside its payload.
  - surface: mcp
    endpoint: https://www.hibobbie.com/api/mcp
    transport: JSON-RPC 2.0
    shape: [error.code, error.message, error.data]
