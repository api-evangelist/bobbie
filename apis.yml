aid: bobbie
name: Bobbie
description: >-
  Bobbie is an American organic infant formula company founded in 2018 by Laura Modi and
  Sarah Hardy — the only mom-founded, women-led infant formula manufacturer in the United
  States, selling direct to parents at hibobbie.com and through Bobbie Medical for
  healthcare professionals. Bobbie has no developer program, but its Shopify-hosted
  storefront exposes a substantial machine-readable surface from its own domain: an
  anonymously introspectable Storefront GraphQL API, a live Model Context Protocol server
  with five catalog and cart tools, a Universal Commerce Protocol merchant profile at
  /.well-known/ucp with UCP MCP commerce endpoints, OpenID Connect and RFC 8414 discovery
  for customer accounts, and a provider-authored /agents.md (mirrored at /llms.txt) that
  tells AI agents which surface to use and requires explicit buyer approval before any
  agent completes a payment.
