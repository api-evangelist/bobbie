apis:
- aid: bobbie:storefront-graphql
  name: Bobbie Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served from Bobbie's own domain. Introspection
    is anonymous — the full schema (416 types, 35 query fields, 41 mutations) was
    retrieved without a Storefront access token on 2026-08-02. Covers the product
    catalog, collections, selling plans (Bobbie's formula subscriptions), cart and
    checkout preparation, editorial content, and customer accounts.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://www.hibobbie.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  tags_raw:
  - GraphQL
  - Ecommerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/bobbie-storefront.graphql
  - type: GraphQLManifest
    url: graphql/bobbie-graphql.yml
  - type: DataModel
    url: data-model/bobbie-data-model.yml
- aid: bobbie:storefront-mcp
  name: Bobbie Storefront MCP Server
  description: >-
    A live Model Context Protocol server on Bobbie's storefront host. An anonymous
    JSON-RPC tools/list returned five tools with full JSON Schema input contracts —
    search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs.
  humanURL: https://www.hibobbie.com/agents.md
  baseURL: https://www.hibobbie.com/api/mcp
  tags:
  - MCP
  - Agents
  - E-Commerce
  tags_raw:
  - MCP
  - Agents
  - Ecommerce
  properties:
  - type: MCPServer
    url: mcp/bobbie-mcp.yml
  - type: ToolCrosswalk
    url: mcp/bobbie-tool-crosswalk.yml
- aid: bobbie:ucp-commerce
  name: Bobbie UCP Agentic Commerce
  description: >-
    Bobbie implements the Universal Commerce Protocol for agent-driven commerce. The
    merchant profile at /.well-known/ucp declares UCP 2026-04-08 and 2026-01-23, the
    dev.ucp.shopping MCP service endpoint, the cart / checkout / fulfillment / discount
    capabilities, and three payment handlers (Google Pay, Shopify card, Shop Pay). The
    MCP endpoint requires a resolvable agent profile URI, and checkout completion
    requires contemporaneous buyer approval.
  humanURL: https://ucp.dev
  baseURL: https://www.hibobbie.com/api/ucp/mcp
  tags:
  - UCP
  - Agentic Commerce
  - MCP
  - Checkout
  properties:
  - type: AgenticAccess
    url: agentic-access/bobbie-agentic-access.yml
